<style>

nsform:uppercase}.stat strong{display:block;font-size:22px;margin-top:5px}.listhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.dow{text-align:center;color:#8d9993;font-size:11px;font-weight:800;padding:5px}.day{min-height:76px;border:1px solid var(--border);border-radius:9px;background:#fff;padding:6px;cursor:pointer}.day.booked{background:#e1edea;border-color:#bfdad3}.day.refunded{background:#f6e3e1}.day.blocked{background:#f1ebdd}.day.today .n{background:var(--ink);color:#fff;border-radius:5px;padding:3px 5px}.n{font-size:12px}.guest{font-size:11px;font-weight:700;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--border)}.row:last-child{border-bottom:0}.avatar{width:36px;height:36px;border-radius:9px;background:#f1ebdd;display:grid;place-items:center;font-weight:800;flex-shrink:0}.main{flex:1;min-width:0}.main b{font-size:14px}.main small,.staffline{display:block;color:var(--soft);font-size:11px;margin-top:2px}.badge{font-size:11px;padding:4px 8px;border-radius:999px;font-weight:800}.badge.booked{background:#e1edea;color:var(--teal2)}.badge.cancelled{background:#f1ebdd;color:#6e716e}.badge.refunded{background:#f6e3e1;color:#7a3a3d}.search{border:1px solid var(--border);border-radius:9px;padding:9px 11px;background:#fff}.empty{text-align:center;color:var(--soft);padding:28px}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:100%;max-width:410px;background:#fff;border:1px solid var(--border);border-radius:18px;padding:25px;box-shadow:var(--shadow)}.field{margin-bottom:13px}.field label{display:block;font-size:12px;font-weight:800;color:var(--soft);margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:9px;background:var(--bg)}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.overlay{position:fixed;inset:0;background:#22302c73;display:none;align-items:flex-end;justify-content:center;z-index:50}.overlay.show{display:flex}.drawer{width:100%;max-width:620px;max-height:94vh;overflow:auto;background:#fff;border-radius:20px 20px 0 0}.dh{position:sticky;top:0;z-index:2;background:#fff;border-bottom:1px solid var(--border);padding:16px 20px;display:flex;justify-content:space-between}.db{padding:20px}.note{font-size:12px;color:var(--soft);background:#f1ebdd;padding:11px;border-radius:9px;margin-bottom:12px}.err{color:var(--red);font-size:12px;margin:6px 0}.drawerActions{display:flex;gap:9px;margin-top:18px}.drawerActions>*{flex:1}.upload{border:1.5px dashed var(--border);border-radius:9px;padding:15px;text-align:center;color:var(--soft);cursor:pointer}.filelist{margin-top:8px;font-size:12px}.fileitem{display:flex;justify-content:space-between;gap:8px;padding:7px;border-bottom:1px solid var(--border)}.hidden{display:none!important}

<script>
const CONFIG={SUPABASE_URL:'https://gaqzoybdlhjtvftykjxs.supabase.co',SUPABASE_KEY:'sb_publishable_VMxnlZ146Z-ufMgPSKxutA_oZJzNm3_',COMPANY_WHATSAPP:'919041068105'};
const sb=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_KEY);
let user=null,profile=null,properties=[],activePropertyId=null,bookings=[],blocked=[],year=new Date().getFullYear(),month=new Date().getMonth(),search='',showAll=false,channel=null,pendingFiles=[];
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)},fmt=d=>{const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),x=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${x}`},money=n=>'₹'+Number(n||0).toLocaleString('en-IN');
function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').style.display='none',3200)}
function sync(b){$('dot').classList.toggle('busy',b);$('syncText').textContent=b?'Saving…':'Synced'}
function admin(){return profile?.role==='admin'} function prop(){return properties.find(p=>p.id===activePropertyId)} function nights(a,b){return Math.max(0,Math.round((date(b)-date(a))/86400000))}
function normalize(b){return{id:b.id,propertyId:b.property_id,guestName:b.guest_name||'',mobile:b.guest_phone||'',guests:Number(b.guests)||1,checkIn:b.check_in,checkOut:b.check_out,price:Number(b.amount)||0,discount:Number(b.discount)||0,paymentMode:b.payment_mode||'',status:b.status==='confirmed'?'booked':(b.status||'booked'),refundAmount:Number(b.refund_amount)||0,notes:b.notes||'',createdBy:b.created_by,staffId:b.staff_id||'',staffName:b.staff_name||'',createdAt:b.created_at,isBlock:!!b.is_block}}
function normBlock(b){return{id:b.id,propertyId:b.property_id,checkIn:b.blocked_date,checkOut:fmt(new Date(date(b.blocked_date).getTime()+86400000)),blocked:true,createdBy:b.created_by}}
async function loadProfile(){const r=await sb.from('profiles').select('*').eq('id',user.id).single();if(r.error)throw r.error;profile=r.data}
async function loadProperties(){const r=await sb.from('properties').select('*').order('created_at');if(r.error)throw r.error;properties=(r.data||[]).filter(p=>p.active!==false);if(!activePropertyId||!properties.some(p=>p.id===activePropertyId))activePropertyId=properties[0]?.id||null}
async function loadBookings(){if(!activePropertyId){bookings=[];blocked=[];return}sync(true);const [b,x]=await Promise.all([sb.from('bookings').select('*').eq('property_id',activePropertyId).order('check_in'),sb.from('blocked_dates').select('*').eq('property_id',activePropertyId).order('blocked_date')]);if(b.error)throw b.error;if(x.error)throw x.error;bookings=b.data||[];blocked=(x.data||[]).map(normBlock);sync(false)}
function activeOn(ds){return bookings.map(normalize).filter(b=>!b.isBlock&&b.status!=='cancelled'&&ds>=b.checkIn&&ds<b.checkOut)}
function blockedOn(ds){return blocked.find(b=>b.blocked&&ds>=b.checkIn&&ds<b.checkOut)}
function render(){renderProps();renderStats();renderCalendar();renderBookings()}
function renderProps(){$('props').innerHTML=properties.map(p=>`<button class="prop ${p.id===activePropertyId?'active':''}" data-p="${p.id}">${esc(p.name)}</button>`).join('')+(admin()?'<button id="addProp" class="prop">＋ Add property</button>':'');$('props').querySelectorAll('[data-p]').forEach(b=>b.onclick=async()=>{activePropertyId=b.dataset.p;await loadBookings();render()});if(admin())$('addProp').onclick=addProperty}
function renderStats(){const prefix=`${year}-${String(month+1).padStart(2,'0')}`;const bs=bookings.map(normalize).filter(b=>!b.isBlock&&b.status!=='cancelled'&&b.checkIn?.startsWith(prefix));const revenue=bs.reduce((s,b)=>s+b.price-b.discount-(b.status==='refunded'?b.refundAmount:0),0);let booked=0;const days=new Date(year,month+1,0).getDate();for(let d=1;d<=days;d++)if(activeOn(fmt(new Date(year,month,d))).length)booked++;$('stats').innerHTML=[['Properties',properties.length],['Bookings this month',bs.length],['Revenue this month',money(revenue)],['Booked nights / '+days,booked]].map(x=>`<div class="stat"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('')}
function renderCalendar(){const names=['January','February','March','April','May','June','July','August','September','October','November','December'];$('monthTitle').textContent=`${names[month]} ${year}`;$('dow').innerHTML=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="dow">${x}</div>`).join('');let h='';const first=new Date(year,month,1).getDay(),days=new Date(year,month+1,0).getDate(),today=fmt(new Date());for(let i=0;i<first;i++)h+='<div></div>';for(let d=1;d<=days;d++){const ds=fmt(new Date(year,month,d)),a=activeOn(ds),bl=blockedOn(ds);let cls='day'+(ds===today?' today':''),guest='';if(bl)cls+=' blocked';else if(a.length){cls+=a[0].status==='refunded'?' refunded':' booked';guest=`<div class="guest">${esc(a[0].guestName)}<br><span style="font-weight:500">${esc(a[0].staffId||a[0].staffName||'')}</span></div>`}h+=`<div class="${cls}" data-date="${ds}"><span class="n">${d}</span>${guest}</div>`}$('cal').innerHTML=h;$('cal').querySelectorAll('[data-date]').forEach(c=>c.onclick=()=>openDate(c.dataset.date))}
function renderBookings(){let arr=bookings.map(normalize).filter(b=>!b.isBlock);if(!showAll){const p=`${year}-${String(month+1).padStart(2,'0')}`;arr=arr.filter(b=>b.checkIn?.startsWith(p)||b.checkOut?.startsWith(p))}if(search){const q=search.toLowerCase();arr=arr.filter(b=>(b.guestName+' '+b.mobile+' '+b.staffName+' '+b.staffId).toLowerCase().includes(q))}arr.sort((a,b)=>String(b.checkIn).localeCompare(String(a.checkIn)));$('bookings').innerHTML=arr.length?arr.map(b=>`<div class="row"><div class="avatar">${esc((b.guestName||'?').slice(0,2).toUpperCase())}</div><div class="main"><b>${esc(b.guestName)}</b><small>${b.checkIn} → ${b.checkOut} • ${b.guests} guest${b.guests>1?'s':''} • ${esc(b.mobile)}</small><div class="staffline">Booked by: <b>${esc(b.staffId||b.staffName||b.createdBy||'—')}</b>${b.staffName?' — '+esc(b.staffName):''}</div></div><span class="badge ${b.status}">${b.status}</span><div class="actions"><button class="btn" data-view="${b.id}">View</button>${b.mobile?`<button class="btn wa" data-wa="${b.id}">WhatsApp</button>`:''}</div></div>`).join(''):'<div class="empty">No bookings found.</div>'; $('bookings').querySelectorAll('[data-view]').forEach(x=>x.onclick=()=>openBooking(arr.find(b=>b.id===x.dataset.view)));$('bookings').querySelectorAll('[data-wa]').forEach(x=>x.onclick=()=>window.open(guestWhatsApp(arr.find(b=>b.id===x.dataset.wa)),'_blank'))}
function openDrawer(){$('overlay').classList.add('show')}function closeDrawer(){$('overlay').classList.remove('show')}
function form(existing,prefill){
  pendingFiles=[];
  const b=existing||{guestName:'',mobile:'',guests:1,checkIn:prefill,checkOut:'',price:0,discount:0,paymentMode:'GPay',status:'booked',notes:''};
  const isStaffView=!!existing&&!admin();
  $('drawerTitle').textContent=existing?(isStaffView?'View booking':'Booking details'):'New booking';
  $('drawer').innerHTML=`
    ${existing?`<div class="note"><b>${isStaffView?'Read-only staff view':'Booking details'}</b><br>Booked by: <b>${esc(b.staffId||b.staffName||b.createdBy||'—')}</b>${b.staffName?' — '+esc(b.staffName):''}</div>`:''}
    <div class="field"><label>Guest name</label><input id="f_name" value="${esc(b.guestName)}" ${isStaffView?'readonly':''}></div>
    <div class="two"><div class="field"><label>Mobile number</label><input id="f_mobile" value="${esc(b.mobile)}" ${isStaffView?'readonly':''}></div><div class="field"><label>Number of guests</label><input id="f_guests" type="number" min="1" value="${b.guests||1}" ${isStaffView?'disabled':''}></div></div>
    <div class="two"><div class="field"><label>Check-in</label><input id="f_in" type="date" value="${b.checkIn||''}" ${isStaffView?'disabled':''}></div><div class="field"><label>Check-out</label><input id="f_out" type="date" value="${b.checkOut||''}" ${isStaffView?'disabled':''}></div></div>
    <div class="two"><div class="field"><label>Amount (₹)</label><input id="f_price" type="number" value="${b.price||0}" ${isStaffView?'readonly':''}></div><div class="field"><label>Discount (₹)</label><input id="f_discount" type="number" value="${b.discount||0}" ${isStaffView?'readonly':''}></div></div>
    <div class="field"><label>Payment mode</label><select id="f_pay" ${isStaffView?'disabled':''}>${['GPay','Bank Transfer','Cash','Cheque','Other'].map(x=>`<option ${x===b.paymentMode?'selected':''}>${x}</option>`).join('')}</select></div>
    <div class="field"><label>Status</label><div class="actions">${['booked','cancelled','refunded'].map(s=>`<button type="button" class="btn ${b.status===s?'primary':''}" data-st="${s}" ${isStaffView?'disabled':''}>${s[0].toUpperCase()+s.slice(1)}</button>`).join('')}</div></div>
    <div class="field"><label>Guest ID / documents — unlimited</label>${existing?'<div id="savedFiles" class="filelist"></div>':'<div id="upload" class="upload">Choose one or many ID files</div><input id="files" type="file" multiple accept="image/*,.pdf" hidden><div id="filelist" class="filelist"></div>'}</div>
    <div class="field"><label>Note</label><textarea id="f_notes" rows="3" ${isStaffView?'readonly':''}>${esc(b.notes)}</textarea></div>
    <div id="formErr" class="err"></div>
    <div class="drawerActions"><button id="cancel" class="btn">Close</button>${!existing?'<button id="save" class="btn primary">Save booking</button>':''}${admin()&&existing?'<button id="cancelBooking" class="btn danger">Cancel booking</button>':''}</div>
    ${existing?'<div style="margin-top:10px;font-size:12px;color:var(--soft)">Staff cannot edit saved bookings. Booking history and uploaded IDs are retained.</div>':''}`;
  if(existing) renderSavedFiles(existing.id);
  $('cancel').onclick=closeDrawer;
  if(isStaffView){openDrawer();return;}
  let status=b.status;
  $('drawer').querySelectorAll('[data-st]').forEach(x=>x.onclick=()=>{status=x.dataset.st;$('drawer').querySelectorAll('[data-st]').forEach(y=>y.classList.remove('primary'));x.classList.add('primary')});
  if($('upload'))$('upload').onclick=()=>$('files').click();
  if($('files'))$('files').onchange=e=>{pendingFiles.push(...Array.from(e.target.files));renderFiles()};
  if($('save'))$('save').onclick=()=>saveBooking(existing,status);
  if($('cancelBooking'))$('cancelBooking').onclick=()=>saveBooking(existing,'cancelled');
  openDrawer();
}

async function loadBookingFiles(bookingId){
  if(!bookingId) return [];
  // First read the table used by the uploader. Select only columns that are
  // actually written by this app; do not depend on optional columns such as
  // size_bytes or archived.
  let r=await sb.from('guest_documents')
    .select('id,file_name,storage_path,mime_type,created_at')
    .eq('booking_id',bookingId)
    .order('created_at');
  if(!r.error && (r.data||[]).length) return r.data||[];

  // Older installations may have stored documents in booking_files.
  let b=await sb.from('booking_files')
    .select('id,file_name,storage_path,mime_type,created_at')
    .eq('booking_id',bookingId)
    .order('created_at');
  if(!b.error && (b.data||[]).length) return b.data||[];

  if(r.error && b.error) throw r.error;
  return [];
}
async function renderSavedFiles(bookingId){
  const box=$('savedFiles');
  if(!box) return;
  box.innerHTML='<div style="color:var(--soft)">Loading saved IDs…</div>';
  try{
    const files=await loadBookingFiles(bookingId);
    if(!files.length){box.innerHTML='<div style="color:var(--soft)">No ID/document uploaded for this booking.</div>';return;}
    box.innerHTML='<div style="font-weight:800;margin:10px 0 5px">Saved ID files</div>';
    for(const f of files){
      const u=await sb.storage.from('guest-ids').createSignedUrl(f.storage_path,3600);
      const row=document.createElement('div');row.className='fileitem';
      const label=document.createElement('span');label.textContent=f.file_name;
      const actions=document.createElement('span');
      if(u.data?.signedUrl){
        const a=document.createElement('a');a.href=u.data.signedUrl;a.target='_blank';a.rel='noopener';a.className='btn';a.textContent=(f.mime_type||'').startsWith('image/')?'View ID':'Open document';actions.appendChild(a);
      }else{
        const e=document.createElement('span');e.className='err';e.textContent='File unavailable';actions.appendChild(e);
      }
      row.appendChild(label);row.appendChild(actions);box.appendChild(row);
    }
  }catch(e){box.innerHTML='<div class="err">Saved ID files could not be loaded: '+esc(e.message||e)+'</div>';}
}

function renderFiles(){$('filelist').innerHTML=pendingFiles.map((f,i)=>`<div class="fileitem"><span>${esc(f.name)}</span><button class="btn" onclick="pendingFiles.splice(${i},1);renderFiles()">Remove</button></div>`).join('')}
function openBooking(b){form(b)}
function openDate(ds){const a=activeOn(ds)[0],bl=blockedOn(ds);if(a)return openBooking(a);if(bl)return openBlock(bl);$('drawerTitle').textContent='Available date';$('drawer').innerHTML=`<div class="note">${ds} is available.</div><div class="drawerActions"><button id="bookDate" class="btn primary">Add booking</button>${admin()?'<button id="blockDate" class="btn">Block this date</button>':''}</div>`;openDrawer();$('bookDate').onclick=()=>{closeDrawer();form(null,ds)};if($('blockDate'))$('blockDate').onclick=()=>blockDate(ds)}
async function blockDate(ds){if(!user)return;const r=await sb.from('blocked_dates').upsert({property_id:activePropertyId,blocked_date:ds,blocked:true,created_by:user.id},{onConflict:'property_id,blocked_date'});if(r.error)return toast(r.error.message);closeDrawer();await loadBookings();render();toast('Date blocked')}
function openBlock(b){$('drawerTitle').textContent='Blocked date';$('drawer').innerHTML=`<div class="note">${b.checkIn} is blocked/unavailable.</div><div class="drawerActions"><button id="unblock" class="btn primary">Make available</button><button id="x" class="btn">Close</button></div>`;openDrawer();$('x').onclick=closeDrawer;$('unblock').onclick=async()=>{const r=await sb.from('blocked_dates').delete().eq('id',b.id);if(r.error)return toast(r.error.message);closeDrawer();await loadBookings();render();toast('Date available again')}}
async function saveBooking(existing,status){const name=$('f_name').value.trim(),ci=$('f_in').value,co=$('f_out').value;if(!name||!ci||!co||co<=ci)return $('formErr').textContent='Enter guest name and valid dates.';const overlap=bookings.map(normalize).find(b=>!b.isBlock&&b.status!=='cancelled'&&b.id!==(existing?.id)&&ci<b.checkOut&&co>b.checkIn);if(overlap)return $('formErr').textContent=`Dates already booked by ${overlap.guestName}.`;const row={property_id:activePropertyId,guest_name:name,guest_phone:$('f_mobile').value.trim(),guests:Number($('f_guests').value)||1,check_in:ci,check_out:co,amount:Number($('f_price').value)||0,status:status==='booked'?'booked':status,notes:$('f_notes').value.trim(),created_by:user.id,staff_id:profile?.staff_id||null,staff_name:profile?.full_name||user.email,discount:Number($('f_discount').value)||0,payment_mode:$('f_pay').value,refund_amount:status==='refunded'?(Number($('f_price').value)||0):0,is_block:false};sync(true);const r=existing?await sb.from('bookings').update(row).eq('id',existing.id).select().single():await sb.from('bookings').insert(row).select().single();if(r.error){sync(false);return $('formErr').textContent=r.error.message}const saved=normalize(r.data);for(const f of pendingFiles){const safe=f.name.replace(/[^a-zA-Z0-9._-]/g,'_'),path=`${saved.id}/${Date.now()}_${Math.random().toString(36).slice(2)}_${safe}`;const up=await sb.storage.from('guest-ids').upload(path,f,{upsert:false});if(up.error){toast('Booking saved, but ID upload failed: '+up.error.message);continue}
    let doc=await sb.from('guest_documents').insert({booking_id:saved.id,property_id:activePropertyId,storage_path:path,file_name:f.name,mime_type:f.type,created_by:user.id});
    if(doc.error && /guest_documents|relation|schema cache/i.test(doc.error.message||'')){doc=await sb.from('booking_files').insert({booking_id:saved.id,property_id:activePropertyId,storage_path:path,file_name:f.name,mime_type:f.type,created_by:user.id})}
    if(doc.error) toast('Booking saved, but ID record failed: '+doc.error.message);}sync(false);closeDrawer();await loadBookings();render();toast(existing?'Booking updated':'Booking saved');if(saved.status==='booked'){window.open(companyWhatsApp(saved),'_blank')}}
function guestWhatsApp(b){let n=String(b.mobile||'').replace(/\D/g,'');if(n.length===10)n='91'+n;return `https://wa.me/${n}?text=${encodeURIComponent(bookingMessage(b))}`}
function companyWhatsApp(b){return `https://wa.me/${CONFIG.COMPANY_WHATSAPP}?text=${encodeURIComponent(bookingMessage(b,true))}`}
function bookingMessage(b,company=false){return [company?'NEW BOOKING RECEIVED — My Space Luxury Suite':'Hello '+b.guestName+', greetings from My Space Luxury Suite!','',`Property: ${prop()?.name||''}`,`Guest: ${b.guestName}`,`Guest mobile: ${b.mobile}`,`Guests: ${b.guests}`,`Check-in: ${b.checkIn}`,`Check-out: ${b.checkOut}`,`Amount: ${money(b.price-b.discount)}`,`Payment: ${b.paymentMode||'—'}`,`Status: ${b.status}`,`Booked by: ${b.staffId||b.staffName||''}`,'',company?'Please confirm/record this booking.':'Thank you for choosing us!'].join('\n')}
async function addProperty(){if(!admin())return;$('drawerTitle').textContent='Add property';$('drawer').innerHTML=`<div class="field"><label>Property name</label><input id="p_name" placeholder="e.g. 4BHK Luxury Villa"></div><div class="field"><label>Location / Address</label><input id="p_address" placeholder="Mohali / Chandigarh"></div><div class="field"><label>Description (optional)</label><textarea id="p_desc" rows="3"></textarea></div><div id="p_err" class="err"></div><div class="drawerActions"><button id="pc" class="btn">Close</button><button id="ps" class="btn primary">Add property</button></div>`;openDrawer();$('pc').onclick=closeDrawer;$('ps').onclick=async()=>{const name=$('p_name').value.trim();if(!name)return $('p_err').textContent='Property name required.';const r=await sb.from('properties').insert({name,address:$('p_address').value.trim(),description:$('p_desc').value.trim(),active:true}).select().single();if(r.error)return $('p_err').textContent=r.error.message;closeDrawer();await loadProperties();activePropertyId=r.data.id;await loadBookings();render();toast('Property added successfully')}}
async function staffPanel(){if(!admin())return;const r=await sb.from('profiles').select('id,full_name,role,business_name,staff_id').order('created_at');if(r.error)return toast(r.error.message);$('drawerTitle').textContent='Staff members';$('drawer').innerHTML=`<div class="note"><b>Add staff here.</b> Enter login email, password, name and Staff ID. The app securely creates the Auth account + staff profile for you. No manual UUID entry.</div><div class="field"><label>Staff login email</label><input id="s_email" type="email" placeholder="staff@example.com"></div><div class="field"><label>Temporary password</label><input id="s_pass" type="password" placeholder="Minimum 6 characters"></div><div class="field"><label>Staff name</label><input id="s_name" placeholder="Staff name"></div><div class="field"><label>Staff ID</label><input id="s_staff" placeholder="ST-001"></div><div id="staffErr" class="err"></div><button id="addStaff" class="btn primary" style="width:100%">Create staff account</button><hr style="border:0;border-top:1px solid var(--border);margin:18px 0"><div>${r.data.map(x=>`<div class="row"><div class="main"><b>${esc(x.full_name||'Unnamed')}</b><small>${esc(x.staff_id||'No Staff ID')} • ${esc(x.role)} • ${esc(x.id)}</small></div></div>`).join('')||'<div class="empty">No profiles.</div>'}</div>`;openDrawer();$('addStaff').onclick=createStaff}
async function createStaff(){
  const email=$('s_email').value.trim(),pass=$('s_pass').value,
        name=$('s_name').value.trim(),sid=$('s_staff').value.trim();
  if(!email||!pass||!name||!sid)return $('staffErr').textContent='Email, password, staff name and Staff ID are required.';
  if(pass.length<6)return $('staffErr').textContent='Password must be at least 6 characters.';
  $('staffErr').textContent='Creating staff account…';
  try{
    const session=(await sb.auth.getSession()).data.session;
    if(!session?.access_token) throw new Error('Admin session expired. Please log in again.');
    const resp=await fetch(CONFIG.SUPABASE_URL+'/functions/v1/create-staff',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'Authorization':'Bearer '+session.access_token,
        'apikey':CONFIG.SUPABASE_KEY
      },
      body:JSON.stringify({email,password:pass,full_name:name,staff_id:sid})
    });
    const body=await resp.json().catch(()=>({}));
    if(!resp.ok) throw new Error(body.error||body.message||('Staff creation failed ('+resp.status+'). Deploy the one-time create-staff function first.'));
    $('staffErr').textContent='';
    toast('Staff account created: '+email);
    closeDrawer();
    await staffPanel();
  }catch(e){
    $('staffErr').textContent=e.message||String(e);
  }
}
async function settings(){if(!admin())return;const p=profile||{};$('drawerTitle').textContent='Admin settings';$('drawer').innerHTML=`<div class="field"><label>Business name</label><input id="biz" value="${esc(p.business_name||'My Space Luxury Suite')}"></div><div class="note">Company WhatsApp notification: +91 ${CONFIG.COMPANY_WHATSAPP.slice(2)}</div><div class="note">Data is stored in Supabase cloud. This app does not hard-delete booking history; use Cancelled/Refunded.</div><button id="saveSet" class="btn primary" style="width:100%">Save</button>`;openDrawer();$('saveSet').onclick=async()=>{const r=await sb.from('profiles').update({business_name:$('biz').value.trim()}).eq('id',user.id);if(r.error)return toast(r.error.message);profile.business_name=$('biz').value.trim();closeDrawer();toast('Settings saved')}}
function buildRows(arr,p){return arr.map(b=>({'Property':p.name,'Guest name':b.guestName,'Mobile':b.mobile,'Guests':b.guests,'Check-in':b.checkIn,'Check-out':b.checkOut,'Nights':nights(b.checkIn,b.checkOut),'Amount':b.price,'Discount':b.discount,'Payable':b.price-b.discount,'Payment mode':b.paymentMode,'Status':b.status,'Staff ID':b.staffId,'Staff name':b.staffName,'Created by UUID':b.createdBy,'Notes':b.notes,'Created':b.createdAt}))}
async function exportExcel(monthOnly){const wb=XLSX.utils.book_new();for(const p of properties){const r=await sb.from('bookings').select('*').eq('property_id',p.id).order('check_in');if(r.error)return toast(r.error.message);let arr=(r.data||[]).map(normalize).filter(b=>!b.isBlock);if(monthOnly){const pre=`${year}-${String(month+1).padStart(2,'0')}`;arr=arr.filter(b=>b.checkIn?.startsWith(pre)||b.checkOut?.startsWith(pre))}let sheet=(p.name||'Property').replace(/[\\/?*\[\]:]/g,' ').slice(0,31)||'Property';XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(buildRows(arr,p)),sheet)}if(!properties.length)XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet([]),'No properties');XLSX.writeFile(wb,monthOnly?`Bookings-${year}-${String(month+1).padStart(2,'0')}.xlsx`:'Bookings-Full-History.xlsx')}
async function refresh(){try{await loadProperties();await loadBookings();render()}catch(e){sync(false);toast(e.message)}}
$('prev').onclick=()=>{month--;if(month<0){month=11;year--}render()};$('next').onclick=()=>{month++;if(month>11){month=0;year++}render()};$('search').oninput=e=>{search=e.target.value;renderBookings()};$('allMode').onclick=()=>{showAll=!showAll;$('allMode').textContent=showAll?'This month':'All history';renderBookings()};$('monthX').onclick=()=>exportExcel(true);$('allX').onclick=()=>exportExcel(false);$('staffBtn').onclick=staffPanel;$('settingsBtn').onclick=settings;$('close').onclick=closeDrawer;$('overlay').onclick=e=>{if(e.target===$('overlay'))closeDrawer()};$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};$('loginBtn').onclick=login;$('password').onkeydown=e=>{if(e.key==='Enter')login()};
async function login(){const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return;$('loginErr').textContent='';const r=await sb.auth.signInWithPassword({email,password});if(r.error)return $('loginErr').textContent=r.error.message;user=r.data.user;try{await loadProfile()}catch(e){$('loginErr').textContent='Login worked, but this user has no profile. Ask admin to create the staff profile.';await sb.auth.signOut();return}await start()}
async function start(){if(channel)sb.removeChannel(channel);$('login').style.display='none';$('app').classList.remove('hidden');$('role').textContent=admin()?'Admin':'Staff';$('role').className='pill '+(admin()?'admin':'staff');$('staffBtn').style.display=admin()?'inline-block':'none';$('settingsBtn').style.display=admin()?'inline-block':'none';await refresh();channel=sb.channel('booking-sync-all').on('postgres_changes',{event:'*',schema:'public',table:'bookings'},refresh).on('postgres_changes',{event:'*',schema:'public',table:'properties'},refresh).on('postgres_changes',{event:'*',schema:'public',table:'blocked_dates'},refresh).subscribe();setInterval(refresh,20000)}
(async()=>{const r=await sb.auth.getSession();if(r.data.session){user=r.data.session.user;try{await loadProfile();await start()}catch(e){}}})();
</script></body></html>
