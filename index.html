<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Space Luxury Suite - Booking</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7f7;
  color:#173b3b;
}
.wrap{
  max-width:1050px;
  margin:auto;
  padding:24px;
}
.card{
  background:white;
  border-radius:16px;
  padding:24px;
  margin-bottom:20px;
  box-shadow:0 8px 30px #0001;
}
h1,h2{margin-top:0}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:14px;
}
input,select,button{
  width:100%;
  padding:12px;
  border:1px solid #ccd6d6;
  border-radius:9px;
  font-size:15px;
}
button{
  background:#174f4f;
  color:white;
  border:0;
  cursor:pointer;
  font-weight:600;
}
button:hover{opacity:.9}
.top{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:center;
  flex-wrap:wrap;
}
.hidden{display:none}
.muted{color:#667}
.msg{
  padding:10px;
  border-radius:8px;
  background:#eef5f5;
  margin-top:12px;
}
.property{
  padding:14px;
  border:1px solid #ddd;
  border-radius:10px;
  margin-top:10px;
}
.property-name{
  font-size:18px;
  font-weight:700;
}
.property-address{
  color:#667;
  margin-top:5px;
}
table{
  width:100%;
  border-collapse:collapse;
}
th,td{
  padding:10px;
  border-bottom:1px solid #e6eded;
  text-align:left;
  font-size:14px;
}
@media(max-width:600px){
  .wrap{padding:12px}
  .card{padding:18px}
}
</style>
</head>

<body>

<div class="wrap">

  <!-- LOGIN -->
  <section id="login" class="card" style="max-width:430px;margin:70px auto">
    <h1>Sign in</h1>
    <p class="muted">Use your registered email and password.</p>

    <input id="email" type="email" placeholder="Email">

    <br><br>

    <input id="password" type="password" placeholder="Password">

    <br><br>

    <button onclick="login()">Log in</button>

    <div id="loginMsg"></div>
  </section>


  <!-- APP -->
  <section id="app" class="hidden">

    <div class="top">
      <div>
        <h1>My Space Luxury Suite</h1>
        <div id="who" class="muted"></div>
      </div>

      <button style="width:auto;padding:10px 18px" onclick="logout()">
        Log out
      </button>
    </div>


    <!-- ADMIN -->
    <div id="adminArea" class="hidden">

      <!-- PROPERTIES -->
      <div class="card">

        <h2>Properties</h2>

        <div class="grid">

          <input
            id="propertyName"
            placeholder="Property name"
          >

          <input
            id="propertyAddress"
            placeholder="Location / Address"
          >

          <button onclick="addProperty()">
            Add property
          </button>

        </div>

        <div id="propertyMsg"></div>

        <div id="propertyList">
          Loading properties...
        </div>

      </div>


      <!-- BOOKINGS -->
      <div class="card">

        <h2>Bookings</h2>

        <div id="bookingList">
          Loading...
        </div>

      </div>

    </div>


    <!-- PROFILE -->
    <div class="card">

      <h2>My profile</h2>

      <div id="profileBox">
        Loading...
      </div>

    </div>

  </section>

</div>


<script>

/* =========================
   SUPABASE SETTINGS
========================= */

const SUPABASE_URL =
"https://gaqzoybdlhjtvftykjxs.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_VMxnZ146Z-ufMgPSKxutA_oZJzNm3_";

let sb;
let currentProfile;


/* =========================
   HELPERS
========================= */

function show(id,on=true){
  document
    .getElementById(id)
    .classList
    .toggle("hidden",!on);
}

function msg(id,text){
  document.getElementById(id).innerHTML =
    '<div class="msg">'+text+'</div>';
}


/* =========================
   INITIALIZE
========================= */

async function init(){

  sb = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

  const {
    data:{session}
  } = await sb.auth.getSession();

  if(session){
    await loadApp(session.user);
  }
}


/* =========================
   LOGIN
========================= */

async function login(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  if(!email || !password){
    msg("loginMsg","Please enter email and password.");
    return;
  }

  const {
    data,
    error
  } = await sb.auth.signInWithPassword({
    email,
    password
  });

  if(error){
    msg("loginMsg",error.message);
    return;
  }

  await loadApp(data.user);
}


/* =========================
   LOAD APP
========================= */

async function loadApp(user){

  const {
    data,
    error
  } = await sb
    .from("profiles")
    .select("*")
    .eq("id",user.id)
    .single();

  if(error){
    msg(
      "loginMsg",
      "Login successful, but your booking-system profile was not found."
    );
    return;
  }

  currentProfile = data;

  show("login",false);
  show("app",true);

  document.getElementById("who").textContent =
    user.email + " • " + data.role;

  document.getElementById("profileBox").innerHTML =
    "<b>Name:</b> " +
    (data.full_name || "") +
    "<br><b>Role:</b> " +
    (data.role || "") +
    "<br><b>Business:</b> " +
    (data.business_name || "");

  if(data.role === "admin"){

    show("adminArea",true);

    await loadProperties();
    await loadBookings();

  }else{

    document.getElementById("profileBox").innerHTML +=
      "<br><br><b>Staff account</b>";

  }
}


/* =========================
   LOGOUT
========================= */

async function logout(){

  await sb.auth.signOut();

  location.reload();
}


/* =========================
   ADD PROPERTY
========================= */

async function addProperty(){

  const name =
    document
      .getElementById("propertyName")
      .value
      .trim();

  const address =
    document
      .getElementById("propertyAddress")
      .value
      .trim();

  if(!name){
    msg(
      "propertyMsg",
      "Enter a property name."
    );
    return;
  }

  const {
    error
  } = await sb
    .from("properties")
    .insert({
      name:name,
      address:address
    });

  if(error){

    msg(
      "propertyMsg",
      error.message
    );

    return;
  }

  msg(
    "propertyMsg",
    "Property added successfully."
  );

  document.getElementById("propertyName").value="";
  document.getElementById("propertyAddress").value="";

  await loadProperties();
}


/* =========================
   LOAD PROPERTIES
========================= */

async function loadProperties(){

  const box =
    document.getElementById("propertyList");

  box.innerHTML =
    "Loading properties...";

  const {
    data,
    error
  } = await sb
    .from("properties")
    .select("*")
    .order("created_at",{ascending:false});

  if(error){

    box.innerHTML =
      '<div class="msg">'+
      error.message+
      '</div>';

    return;
  }

  if(!data || data.length === 0){

    box.innerHTML =
      "<p>No properties added yet.</p>";

    return;
  }

  box.innerHTML =
    data.map(function(p){

      return `
        <div class="property">

          <div class="property-name">
            ${escapeHtml(p.name || "")}
          </div>

          <div class="property-address">
            ${escapeHtml(p.address || p.location || "")}
          </div>

        </div>
      `;

    }).join("");
}


/* =========================
   LOAD BOOKINGS
========================= */

async function loadBookings(){

  const box =
    document.getElementById("bookingList");

  const {
    data,
    error
  } = await sb
    .from("bookings")
    .select("*")
    .order("created_at",{ascending:false})
    .limit(100);

  if(error){

    box.innerHTML =
      '<div class="msg">'+
      error.message+
      '</div>';

    return;
  }

  if(!data || data.length === 0){

    box.textContent =
      "No bookings yet.";

    return;
  }

  box.innerHTML = `
    <div style="overflow:auto">
      <table>
        <tr>
          <th>Guest</th>
          <th>Check-in</th>
          <th>Check-out</th>
          <th>Status</th>
        </tr>

        ${data.map(function(b){

          return `
            <tr>
              <td>${escapeHtml(b.guest_name || "")}</td>
              <td>${escapeHtml(b.check_in || "")}</td>
              <td>${escapeHtml(b.check_out || "")}</td>
              <td>${escapeHtml(b.status || "")}</td>
            </tr>
          `;

        }).join("")}

      </table>
    </div>
  `;
}


/* =========================
   SECURITY / HTML ESCAPE
========================= */

function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


/* =========================
   START
========================= */

init();

</script>

</body>
</html>
