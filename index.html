<style>
:root{--bg:#FAF7F1;--surface:#FFF;--surface2:#F1EBDD;--ink:#22302C;--soft:#5B6B63;--faint:#93A099;--border:#E1D8C4;--teal:#2B5F5A;--teal2:#173A36;--coral:#B85A5F;--amber:#C87F3A;--green:#25D366;--shadow:0 4px 18px rgba(34,48,44,.08);--r:14px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}.wrap{max-width:1180px;margin:auto;padding:20px 20px 80px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px}.brand{display:flex;gap:12px;align-items:center}.logo{width:42px;height:42px;border-radius:10px;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:700}.brand h1{font:600 20px Fraunces;margin:0}.brand p{margin:2px 0;color:var(--soft);font-size:12px}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pill,.btn{border:1px solid var(--border);background:#fff;border-radius:9px;padding:8px 12px;font:600 12px Inter;cursor:pointer}.pill{border-radius:999px;color:var(--soft)}.pill.admin{background:#E1EDEA;color:var(--teal2)}.pill.staff{background:#F6E3E1;color:#7A3A3D}.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}.btn.danger{background:var(--coral);border-color:var(--coral);color:#fff}.btn.wa{background:var(--green);border-color:var(--green);color:#fff}.btn:disabled{opacity:.5;cursor:not-allowed}.sync{font-size:12px;color:var(--soft);display:flex;align-items:center;gap:6px}.dot{width:7px;height:7px;border-radius:50%;background:var(--teal)}.dot.busy{background:var(--amber)}.card{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:18px;box-shadow:var(--shadow)}.props{display:flex;gap:8px;flex-wrap:wrap}.prop{border:1px solid var(--border);background:#fff;border-radius:999px;padding:9px 14px;cursor:pointer}.prop.active{background:var(--teal);color:#fff;border-color:var(--teal)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:15px;border:1px solid var(--border);border-radius:12px;background:#fff}.stat small{display:block;text-transform:uppercase;color:var(--soft);font-size:11px}.stat strong{font:500 22px 'IBM Plex Mono';display:block;margin-top:5px}.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.dow{text-align:center;color:var(--faint);font-size:11px;font-weight:700;padding:5px}.day{min-height:70px;border:1px solid var(--border);border-radius:9px;background:#fff;padding:6px;cursor:pointer}.day.booked{background:#E1EDEA;border-color:#BFDAD3}.day.refunded{background:#F6E3E1}.day.blocked{background:var(--surface2)}.day .n{font:12px 'IBM Plex Mono';color:var(--soft)}.day.today .n{background:var(--ink);color:#fff;padding:3px 5px;border-radius:5px}.guest{font-size:11px;margin-top:5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.listhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}.search{padding:9px 11px;border:1px solid var(--border);border-radius:9px;background:#fff}.row{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--border);cursor:pointer}.row:last-child{border-bottom:0}.avatar{width:36px;height:36px;border-radius:9px;background:var(--surface2);display:grid;place-items:center;font-weight:700;flex-shrink:0}.main{flex:1;min-width:0}.main b{font-size:14px}.main small{display:block;color:var(--soft);font-family:'IBM Plex Mono';font-size:11px}.badge{font-size:11px;padding:4px 8px;border-radius:999px;font-weight:700}.badge.booked{background:#E1EDEA;color:var(--teal2)}.badge.cancelled{background:var(--surface2);color:var(--soft)}.badge.refunded{background:#F6E3E1;color:#7A3A3D}.empty{text-align:center;color:var(--soft);padding:30px}.overlay{position:fixed;inset:0;background:rgba(34,48,44,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}.overlay.show{display:flex}.drawer{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0}.dh{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:2}.db{padding:20px}.field{margin-bottom:13px}.field label{display:block;font-size:12px;font-weight:700;color:var(--soft);margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:9px;background:var(--bg);font:14px Inter}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.status{display:flex;gap:7px}.status button{flex:1}.upload{border:1.5px dashed var(--border);padding:14px;border-radius:9px;text-align:center;cursor:pointer;color:var(--soft)}.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:8px}.thumb{position:relative;aspect-ratio:1;border:1px solid var(--border);border-radius:8px;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.thumb button{position:absolute;right:3px;top:3px;background:#000a;color:#fff;border:0;border-radius:5px}.drawerActions{display:flex;gap:9px;margin-top:18px}.drawerActions>*{flex:1}.note{font-size:12px;color:var(--soft);background:var(--surface2);padding:10px;border-radius:9px;margin-bottom:12px}.err{color:var(--coral);font-size:12px;margin:5px 0}.staffline{font-size:11px;color:var(--soft);margin-top:3px}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{max-width:390px;width:100%;background:#fff;border:1px solid var(--border);border-radius:18px;padding:25px;box-shadow:var(--shadow)}#app{display:none}.hidden{display:none!important}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.day{min-height:52px}.guest{display:none}.wrap{padding:12px}.card{padding:14px}}
</style>

<body>
<div id="login" class="login"><div class="loginbox"><h2 style="font:600 24px Fraunces;margin:0 0 6px">Booking Admin</h2><p style="color:var(--soft);font-size:13px">My Space Luxury Suite — secure team login</p><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><div id="loginErr" class="err"></div><button id="loginBtn" class="btn primary" style="width:100%">Log in</button></div></div>
<div id="app"><div class="wrap">
<div class="top"><div class="brand"><div class="logo">MS</div><div><h1>Booking Admin</h1><p>My Space Luxury Suite — shared across your whole team</p></div></div><div class="actions"><span id="role" class="pill"></span><span class="sync"><i id="dot" class="dot"></i><span id="syncText">Synced</span></span><button id="staffBtn" class="btn">Staff</button><button id="settingsBtn" class="btn">Settings</button><button id="logout" class="btn">Log out</button></div></div>
<div id="props" class="card"></div><div id="stats" class="stats" style="margin-bottom:18px"></div>
<div class="card"><div class="listhead"><div><b>Excel reports</b><div style="font-size:12px;color:var(--soft)">Separate sheet for every property • full booking history</div></div><div class="actions"><button id="monthX" class="btn">This month</button><button id="allX" class="btn primary">Full history</button></div></div></div>
<div class="card"><div class="listhead"><h2 id="monthTitle" style="font:600 20px Fraunces;margin:0"></h2><div class="actions"><button id="prev" class="btn">‹</button><button id="next" class="btn">›</button></div></div><div style="font-size:12px;color:var(--soft);margin:10px 0">🟢 Booked &nbsp; 🟠 Refunded &nbsp; ⚪ Available &nbsp; 🟤 Blocked</div><div id="dow" class="grid7"></div><div id="cal" class="grid7"></div></div>
<div class="card"><div class="listhead"><h2 style="font:600 20px Fraunces;margin:0">Bookings</h2><div class="actions"><input id="search" class="search" placeholder="Search guest / mobile"><button id="allMode" class="btn">All history</button></div></div><div id="bookings"></div></div>
</div></div>
<div id="overlay" class="overlay"><div class="drawer"><div class="dh"><b id="drawerTitle">New booking</b><button id="close" class="btn">✕</button></div><div id="drawer" class="db"></div></div></div><div id="toast" style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#22302C;color:#fff;padding:10px 18px;border-radius:999px;display:none;z-index:50"></div>
<script>
const CONFIG={SUPABASE_URL:'https://gaqzoybdlhjtvftykjxs.supabase.co',SUPABASE_KEY:'sb_publishable_VMxnlZ146Z-ufMgPSKxutA_oZJzNm3_',COMPANY_WHATSAPP:'+919041068105'};
const sb=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_KEY);
let user=null,profile=null,properties=[],activePropertyId=null,bookings=[],year=new Date().getFullYear(),month=new Date().getMonth(),search='',showAll=false,channel=null,pendingFiles=[];
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}, fmt=d=>d.toISOString().slice(0,10), money=n=>'₹'+Number(n||0).toLocaleString('en-IN');
function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').style.display='none',3000)}
function sync(b){$('dot').className='dot'+(b?' busy':'');$('syncText').textContent=b?'Saving…':'Synced'}
function admin(){return profile?.role==='admin'}
function prop(){return properties.find(p=>p.id===activePropertyId)}
function nights(a,b){return Math.round((date(b)-date(a))/86400000)}
function badge(s){return `<span class="badge ${s}">${s==='booked'?'Booked':s==='refunded'?'Refunded':'Cancelled'}</span>`}
async function loadProfile(){const r=await sb.from('profiles').select('*').eq('id',user.id).single();if(r.error)throw r.error;profile=r.data}
async function loadProperties(){const r=await sb.from('properties').select('*').order('created_at');if(r.error)throw r.error;properties=r.data||[];if(!activePropertyId||!properties.some(p=>p.id===activePropertyId&&!p.archived))activePropertyId=properties.find(p=>!p.archived)?.id||null}
async function loadBookings(){if(!activePropertyId){bookings=[];return}sync(true);const r=await sb.from('bookings').select('*').eq('property_id',activePropertyId).order('check_in');if(r.error)throw r.error;bookings=r.data||[];sync(false)}
function normalize(b){return {id:b.id,propertyId:b.property_id,guestName:b.guest_name||'',mobile:b.guest_phone??b.mobile??'',guests:Number(b.guests)||1,checkIn:b.check_in,checkOut:b.check_out,price:Number(b.amount??b.price??0),discount:Number(b.discount||0),paymentMode:b.payment_mode||'',status:b.status==='confirmed'?'booked':(b.status||'booked'),refundAmount:Number(b.refund_amount||0),notes:b.notes||'',createdBy:b.created_by,staffId:b.staff_id||'',staffName:b.staff_name||'',isBlock:!!b.is_block,createdAt:b.created_at}}
function activeOn(ds){return bookings.map(normalize).filter(b=>!b.isBlock&&b.status!=='cancelled'&&ds>=b.checkIn&&ds<b.checkOut)}
function blockedOn(ds){return bookings.map(normalize).find(b=>b.isBlock&&b.status!=='cancelled'&&ds>=b.checkIn&&ds<b.checkOut)}
function render(){renderProps();renderStats();renderCalendar();renderBookings()}
function renderProps(){$('props').innerHTML=properties.filter(p=>!p.archived).map(p=>`<button class="prop ${p.id===activePropertyId?'active':''}" data-p="${p.id}">${esc(p.name)}</button>`).join('')+(admin()?'<button id="addProp" class="prop">+ Add property</button>':'');$('props').querySelectorAll('[data-p]').forEach(b=>b.onclick=async()=>{activePropertyId=b.dataset.p;await loadBookings();render()});if(admin())$('addProp').onclick=addProperty}
function renderStats(){const prefix=`${year}-${String(month+1).padStart(2,'0')}`;const bs=bookings.map(normalize).filter(b=>!b.isBlock&&b.status!=='cancelled'&&b.checkIn.startsWith(prefix));const revenue=bs.reduce((s,b)=>s+b.price-b.discount-(b.status==='refunded'?b.refundAmount:0),0);const days=new Date(year,month+1,0).getDate();let booked=0;for(let d=1;d<=days;d++){if(activeOn(fmt(new Date(year,month,d))).length)booked++}$('stats').innerHTML=[['Properties',properties.filter(p=>!p.archived).length],['Bookings this month',bs.length],['Revenue this month',money(revenue)],['Booked nights / '+days,booked]].map(x=>`<div class="stat"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('')}
function renderCalendar(){const names=['January','February','March','April','May','June','July','August','September','October','November','December'];$('monthTitle').textContent=`${names[month]} ${year}`;$('dow').innerHTML=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="dow">${x}</div>`).join('');let h='';const first=new Date(year,month,1).getDay(),days=new Date(year,month+1,0).getDate(),today=fmt(new Date());for(let i=0;i<first;i++)h+='<div></div>';for(let d=1;d<=days;d++){const ds=fmt(new Date(year,month,d)),a=activeOn(ds),bl=blockedOn(ds);let cls='day',guest='';if(bl)cls+=' blocked';else if(a.length){cls+=a[0].status==='refunded'?' refunded':' booked';guest=`<div class="guest">${esc(a[0].guestName)}</div>`}h+=`<div class="${cls}" data-date="${ds}"><span class="n">${d}</span>${guest}</div>`}$('cal').innerHTML=h;$('cal').querySelectorAll('[data-date]').forEach(c=>c.onclick=()=>openDate(c.dataset.date))}
function renderBookings(){let arr=bookings.map(normalize).filter(b=>!b.isBlock);if(!showAll){const p=`${year}-${String(month+1).padStart(2,'0')}`;arr=arr.filter(b=>b.checkIn.startsWith(p)||b.checkOut.startsWith(p))}if(search){const q=search.toLowerCase();arr=arr.filter(b=>(b.guestName+' '+b.mobile+' '+b.staffName+' '+b.staffId).toLowerCase().includes(q))}arr.sort((a,b)=>b.checkIn.localeCompare(a.checkIn));$('bookings').innerHTML=arr.length?arr.map(b=>`<div class="row" data-id="${b.id}"><div class="avatar">${esc((b.guestName||'?').slice(0,2).toUpperCase())}</div><div class="main"><b>${esc(b.guestName)}</b><small>${b.checkIn} → ${b.checkOut} • ${b.guests} guest${b.guests>1?'s':''} • ${esc(b.mobile)}</small><div class="staffline">Booked by: ${esc(b.staffName||b.staffId||b.createdBy||'—')}</div></div>${badge(b.status)}<b>${money(b.price-b.discount)}</b></div>`).join(''):'<div class="empty">No bookings found.</div>';$('bookings').querySelectorAll('[data-id]').forEach(r=>r.onclick=()=>openBooking(arr.find(x=>x.id===r.dataset.id)))}
function form(existing,prefill){pendingFiles=[];const b=existing||{guestName:'',mobile:'',guests:1,checkIn:prefill,paymentMode:'GPay',status:'booked',price:0,discount:0,notes:''};$('drawerTitle').textContent=existing?'Booking details':'New booking';$('drawer').innerHTML=`${!admin()&&existing?'<div class="note">Staff can view an existing booking but cannot edit or cancel it.</div>':''}<div class="field"><label>Guest name</label><input id="f_name" value="${esc(b.guestName)}"></div><div class="two"><div class="field"><label>Mobile number</label><input id="f_mobile" value="${esc(b.mobile)}"></div><div class="field"><label>Number of guests</label><input id="f_guests" type="number" min="1" value="${b.guests||1}"></div></div><div class="two"><div class="field"><label>Check-in</label><input id="f_in" type="date" value="${b.checkIn||prefill}"></div><div class="field"><label>Check-out</label><input id="f_out" type="date" value="${b.checkOut||''}"></div></div><div class="two"><div class="field"><label>Amount (₹)</label><input id="f_price" type="number" value="${b.price||0}"></div><div class="field"><label>Discount (₹)</label><input id="f_discount" type="number" value="${b.discount||0}"></div></div><div class="field"><label>Payment mode</label><select id="f_pay">${['GPay','Bank Transfer','Cash','Cheque','Other'].map(x=>`<option ${x===b.paymentMode?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Status</label><div class="status">${['booked','cancelled','refunded'].map(s=>`<button class="btn ${b.status===s?'primary':''}" data-st="${s}">${s[0].toUpperCase()+s.slice(1)}</button>`).join('')}</div></div><div class="field"><label>Guest ID / documents — unlimited</label><div id="upload" class="upload">Choose ID photos/files</div><input id="files" type="file" multiple accept="image/*,.pdf" hidden><div id="thumbs" class="thumbs"></div></div><div class="field"><label>Note</label><textarea id="f_notes" rows="3">${esc(b.notes)}</textarea></div><div id="formErr" class="err"></div><div class="drawerActions"><button id="cancel" class="btn">Close</button>${admin()||!existing?'<button id="save" class="btn primary">Save booking</button>':''}</div>`;if(!admin()&&existing){$('cancel').onclick=closeDrawer;return}let status=b.status;$('drawer').querySelectorAll('[data-st]').forEach(x=>x.onclick=()=>{status=x.dataset.st;$('drawer').querySelectorAll('[data-st]').forEach(y=>y.classList.remove('primary'));x.classList.add('primary')});$('upload').onclick=()=>$('files').click();$('files').onchange=e=>{pendingFiles.push(...Array.from(e.target.files));$('thumbs').innerHTML=pendingFiles.map(f=>`<div class="thumb" title="${esc(f.name)}"><span style="padding:5px;font-size:11px">${esc(f.name.slice(0,18))}</span></div>`).join('')};$('cancel').onclick=closeDrawer;$('save').onclick=()=>saveBooking(existing,status)}
function openDate(ds){const a=activeOn(ds)[0],bl=blockedOn(ds);if(a)return openBooking(a);if(bl)return openBlock(bl);$('drawerTitle').textContent='Choose action';$('drawer').innerHTML=`<div class="note">${ds} is currently available.</div><div class="drawerActions"><button id="bookDate" class="btn primary">Add booking</button><button id="blockDate" class="btn">Block this date</button></div>`;openDrawer();$('bookDate').onclick=()=>{const n=new Date(date(ds));n.setDate(n.getDate()+1);closeDrawer();form(null,ds);$('f_out').value=fmt(n);openDrawer()};$('blockDate').onclick=()=>blockDate(ds)}
async function blockDate(ds){if(!admin())return toast('Only admin can block a date');const n=new Date(date(ds));n.setDate(n.getDate()+1);const r=await sb.from('blocked_dates').insert({property_id:activePropertyId,blocked_date:ds,blocked:true,created_by:user.id}).select().single();if(r.error)return toast(r.error.message);closeDrawer();await loadBookings();render();toast('Date blocked')}
function openBooking(b){form(b);openDrawer()}
function openBlock(b){$('drawerTitle').textContent='Blocked date';$('drawer').innerHTML=`<div class="note">${b.checkIn} is blocked/unavailable.</div><div class="drawerActions"><button id="unblock" class="btn primary">Unblock</button><button id="x" class="btn">Close</button></div>`;openDrawer();$('x').onclick=closeDrawer;$('unblock').onclick=async()=>{if(!admin())return toast('Only admin can unblock dates');const {error}=await sb.from('blocked_dates').delete().eq('id',b.id);if(error)return toast(error.message);closeDrawer();await loadBookings();render();toast('Date unblocked')}}
function openDrawer(){$('overlay').classList.add('show')}function closeDrawer(){$('overlay').classList.remove('show')}
async function saveBooking(existing,status){const name=$('f_name').value.trim(),ci=$('f_in').value,co=$('f_out').value;if(!name||!ci||!co||co<=ci)return $('formErr').textContent='Enter guest name and valid dates.';if(!activePropertyId)return toast('Select a property');const overlap=bookings.map(normalize).find(b=>!b.isBlock&&b.status!=='cancelled'&&b.id!==(existing?.id)&&ci<b.checkOut&&co>b.checkIn);if(overlap)return $('formErr').textContent=`Dates already booked by ${overlap.guestName}.`;sync(true);const row={property_id:activePropertyId,guest_name:name,guest_phone:$('f_mobile').value.trim(),guests:Number($('f_guests').value)||1,check_in:ci,check_out:co,amount:Number($('f_price').value)||0,status:status==='booked'?'booked':status,notes:$('f_notes').value.trim(),created_by:user.id,staff_id:profile?.staff_id||null,staff_name:profile?.full_name||user.email,discount:Number($('f_discount').value)||0,payment_mode:$('f_pay').value,refund_amount:0,is_block:false};let r=existing?await sb.from('bookings').update(row).eq('id',existing.id).select().single():await sb.from('bookings').insert(row).select().single();if(r.error){sync(false);return $('formErr').textContent=r.error.message}const saved=normalize(r.data);if(pendingFiles.length){toast('Booking saved; uploading IDs…');for(const f of pendingFiles){const path=`${user.id}/${saved.id}/${Date.now()}_${Math.random().toString(36).slice(2)}_${f.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;const up=await sb.storage.from('guest-ids').upload(path,f,{upsert:false});if(!up.error)await sb.from('booking_files').insert({booking_id:saved.id,property_id:activePropertyId,storage_path:path,file_name:f.name,mime_type:f.type,size_bytes:f.size,created_by:user.id})}}sync(false);closeDrawer();await loadBookings();render();toast(existing?'Booking updated':'Booking saved');if(saved.status==='booked'&&saved.mobile)window.open(guestWhatsApp(saved),'_blank')}
function guestWhatsApp(b){let n=b.mobile.replace(/\D/g,'');if(n.length===10)n='91'+n;const p=prop()?.name||'';const text=[`Hello ${b.guestName}, greetings from My Space Luxury Suite!`,'',`Your booking at ${p} is confirmed.`,`Check-in: ${b.checkIn}`,`Check-out: ${b.checkOut}`,`Guests: ${b.guests}`,`Amount: ${money(b.price-b.discount)}`,`Payment: ${b.paymentMode||'—'}`,'',`Thank you for choosing us!`].join('\n');return `https://wa.me/${n}?text=${encodeURIComponent(text)}`}
async function addProperty(){if(!admin())return;const name=prompt('Property name?');if(!name)return;const address=prompt('Location / Address?')||'';const r=await sb.from('properties').insert({name,address,active:true,archived:false}).select().single();if(r.error)return toast(r.error.message);await loadProperties();render();toast('Property added')}
async function staffPanel(){if(!admin())return;const r=await sb.from('profiles').select('id,full_name,role,business_name,staff_id').order('created_at');if(r.error)return toast(r.error.message);$('drawerTitle').textContent='Staff members';$('drawer').innerHTML=`<div class="note">Create the staff user's Supabase Auth account in Supabase Authentication → Users. Then add the same user's UUID here as the profile ID.</div><div class="field"><label>Auth User UUID</label><input id="s_id" placeholder="UUID from Authentication → Users"></div><div class="field"><label>Staff name</label><input id="s_name"></div><div class="field"><label>Staff ID</label><input id="s_staff" placeholder="e.g. ST-001"></div><div class="field"><label>Role</label><select id="s_role"><option value="staff">Staff</option><option value="admin">Admin</option></select></div><div id="staffErr" class="err"></div><button id="addStaff" class="btn primary" style="width:100%">Save staff profile</button><hr style="border:0;border-top:1px solid var(--border);margin:18px 0"><div>${r.data.map(x=>`<div class="row"><div class="main"><b>${esc(x.full_name||'Unnamed')}</b><small>${esc(x.staff_id||'No Staff ID')} • ${esc(x.role)}</small></div></div>`).join('')||'<div class="empty">No staff profiles.</div>'}</div>`;openDrawer();$('addStaff').onclick=async()=>{const id=$('s_id').value.trim(),name=$('s_name').value.trim(),sid=$('s_staff').value.trim();if(!id||!name||!sid)return $('staffErr').textContent='Enter UUID, name and Staff ID.';const x=await sb.from('profiles').upsert({id,full_name:name,staff_id:sid,role:$('s_role').value}).select().single();if(x.error)return $('staffErr').textContent=x.error.message;closeDrawer();toast('Staff profile saved')}}
async function settings(){if(!admin())return;const p=profile||{};$('drawerTitle').textContent='Admin settings';$('drawer').innerHTML=`<div class="field"><label>Business name</label><input id="biz" value="${esc(p.business_name||'My Space Luxury Suite')}"></div><div class="note">Company WhatsApp number: ${CONFIG.COMPANY_WHATSAPP}</div><button id="saveSet" class="btn primary" style="width:100%">Save</button>`;openDrawer();$('saveSet').onclick=async()=>{const r=await sb.from('profiles').update({business_name:$('biz').value.trim()}).eq('id',user.id);if(r.error)return toast(r.error.message);profile.business_name=$('biz').value.trim();closeDrawer();toast('Settings saved')}}
function buildRows(arr,p){return arr.map(b=>({'Property':p.name,'Guest name':b.guestName,'Mobile':b.mobile,'Guests':b.guests,'Check-in':b.checkIn,'Check-out':b.checkOut,'Nights':nights(b.checkIn,b.checkOut),'Amount':b.price,'Discount':b.discount,'Payable':b.price-b.discount,'Payment mode':b.paymentMode,'Status':b.status,'Staff ID':b.staffId,'Staff name':b.staffName,'Created by UUID':b.createdBy,'Notes':b.notes,'Created':b.createdAt}));}
async function exportExcel(monthOnly){const wb=XLSX.utils.book_new();for(const p of properties.filter(x=>!x.archived)){const r=await sb.from('bookings').select('*').eq('property_id',p.id).order('check_in');if(r.error)return toast(r.error.message);let arr=(r.data||[]).map(normalize).filter(b=>!b.isBlock);if(monthOnly){const pre=`${year}-${String(month+1).padStart(2,'0')}`;arr=arr.filter(b=>b.checkIn.startsWith(pre)||b.checkOut.startsWith(pre))}const ws=XLSX.utils.json_to_sheet(buildRows(arr,p));XLSX.utils.book_append_sheet(wb,ws,(p.name||'Property').replace(/[\\/?*\[\]:]/g,' ').slice(0,31)||'Property')}XLSX.writeFile(wb,monthOnly?`Bookings-${year}-${String(month+1).padStart(2,'0')}.xlsx`:`Bookings-Full-History.xlsx`)}
$('prev').onclick=()=>{month--;if(month<0){month=11;year--}render()};$('next').onclick=()=>{month++;if(month>11){month=0;year++}render()};$('search').oninput=e=>{search=e.target.value;renderBookings()};$('allMode').onclick=()=>{showAll=!showAll;$('allMode').textContent=showAll?'This month':'All history';renderBookings()};$('monthX').onclick=()=>exportExcel(true);$('allX').onclick=()=>exportExcel(false);$('staffBtn').onclick=staffPanel;$('settingsBtn').onclick=settings;$('close').onclick=closeDrawer;$('overlay').onclick=e=>{if(e.target===$('overlay'))closeDrawer()};$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};$('loginBtn').onclick=login;$('password').onkeydown=e=>{if(e.key==='Enter')login()};
async function login(){const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return;$('loginErr').textContent='';const r=await sb.auth.signInWithPassword({email,password});if(r.error)return $('loginErr').textContent=r.error.message;user=r.data.user;try{await loadProfile()}catch(e){$('loginErr').textContent='Login worked, but no profile exists for this user.';await sb.auth.signOut();return}await start()}
async function start(){if(channel)sb.removeChannel(channel);$('login').style.display='none';$('app').style.display='block';$('role').textContent=admin()?'Admin':'Staff';$('role').className='pill '+(admin()?'admin':'staff');$('staffBtn').style.display=admin()?'inline-block':'none';$('settingsBtn').style.display=admin()?'inline-block':'none';try{await loadProperties();await loadBookings();render()}catch(e){toast(e.message)}channel=sb.channel('booking-sync').on('postgres_changes',{event:'*',schema:'public',table:'bookings'},async()=>{try{await loadBookings();render()}catch(e){}}).on('postgres_changes',{event:'*',schema:'public',table:'properties'},async()=>{try{await loadProperties();await loadBookings();render()}catch(e){}}).subscribe();setInterval(async()=>{try{await loadBookings();render()}catch(e){}},15000)}
(async()=>{const r=await sb.auth.getSession();if(r.data.session){user=r.data.session.user;try{await loadProfile();await start()}catch(e){}}})();
</script>
